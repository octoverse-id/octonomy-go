# Octonomy contract coverage — the SDK's own statement about the contract it vendors.
#
# WHY IT EXISTS. An endpoint nobody implemented and an endpoint nobody noticed look
# identical from the outside, and that is how this line came to sit two server
# majors behind, vendoring a contract from before the server made a second API
# surface its primary one.
# A row here turns "not implemented" into a decision with a reason attached. On this
# line that matters more, not less: this tree implements two of the
# eight resource groups the contracts publish, so most of the rows below are gaps,
# and each one says which issue closes it.
#
# WHAT READS IT ON THIS BRANCH, AND WHAT DOES NOT. `contractbaseline_test.go` runs
# in `make test` and in the go1.13 job, and holds this file to four things:
#
#   - every operation docs/openapi.yaml or docs/openapi-v2.yaml publishes has
#     exactly one row, and every row names an operation one of them publishes;
#   - the two specs publish the same operations, since one version-independent
#     row cannot be true of a surface that lacks it;
#   - each row names EITHER an `sdk:` method OR an `unimplemented:` reason, never
#     both and never neither, and a reason says something;
#   - an `sdk:` method is declared in this package on that receiver.
#
# It does NOT check the response fields, the composite bodies, or that a method
# sends what the contract documents. That takes a contract gate: one that CALLS
# each method against a stub built from the vendored schema and reads the request
# off the wire. This branch has none. #98 ports main's
# (https://github.com/octoverse-id/octonomy-go/tree/main/tools/contractdrift), and with it the sections main's copy of this file
# carried beyond `operations` at 61fce9b -- unsent and undocumented inputs, client
# headers, undocumented model fields, the vendored error-code registry. Each of
# those is a statement about what this client sends, decodes, or declares, which
# only a gate can prove, so they arrive with one rather than as prose nothing
# checks.
#
# PATHS ARE VERSION-INDEPENDENT SUFFIXES — `/tags`, never `/api/v1/tags`. The
# resource files build exactly that suffix and the transport prepends the prefix,
# so one row covers the operation on both surfaces. Which surfaces a method reaches
# is the transport's business (octonomy.go, transport.go), not this file's.
#
# THE TWO RESPONSE FIELDS are the recorded divergence between the generated spec
# and the running server, in the vocabulary of main's copy of this file at
# 61fce9b, so the gate #98 ports can read these rows as they stand:
#
#   documented_response   what the VENDORED spec says the success body is:
#                         `array`, `ref:<Schema>`, `none`, or `other`.
#   actual_response       what the running server really returns:
#                         `list-envelope` ({data, pagination}), `data-envelope`
#                         ({data: {...}}), `composite-envelope` ({data: {...counts,
#                         items}}), `bare` (no envelope at all), or `none` (204).
#
# Where the two differ, THE SERVER WINS. The spec is generated by drf-spectacular
# from the serializers and the envelope is added by a renderer below them, so the
# generator cannot see it; a decoder written from the spec returns a zero-valued
# struct or an empty page with a nil error (#32, the same family twice). The values
# on every row were established against a booted server when main's inventory was
# written, and were copied from main's file at 61fce9b, whose specs are the two
# vendored here byte for byte. On an `unimplemented:` row they are carried
# unchanged so the port that implements the operation starts from the reviewed
# shape rather than re-deriving it. On this branch nothing asserts them yet — that
# is #98.
#
# `composite_body` is a WITNESS, not a transcript: the shape is what the server
# returns, the numbers are chosen so a decoder crossing two of them changes both.
# It is copied unchanged from main's file at 61fce9b, and nothing on this branch
# reads it until #98.

operations:
  # --- Tags (tags.go) ---------------------------------------------------------
  - path: /tags
    method: get
    sdk: TagService.List
    documented_response: array
    actual_response: list-envelope
  - path: /tags
    method: post
    sdk: TagService.Create
    documented_response: ref:Tag
    actual_response: data-envelope
  - path: /tags/{tag_id}
    method: get
    sdk: TagService.Get
    documented_response: ref:Tag
    actual_response: data-envelope
  - path: /tags/{tag_id}
    method: patch
    sdk: TagService.Update
    documented_response: ref:Tag
    actual_response: data-envelope
  - path: /tags/{tag_id}
    method: delete
    # Deactivation on the server, not a hard delete. 204, no body either way.
    sdk: TagService.Delete
    documented_response: none
    actual_response: none

  # --- Vocabularies (vocabularies.go) -----------------------------------------
  - path: /vocabularies
    method: get
    sdk: VocabularyService.List
    documented_response: array
    actual_response: list-envelope
  - path: /vocabularies
    method: post
    sdk: VocabularyService.Create
    documented_response: ref:Vocabulary
    actual_response: data-envelope
  - path: /vocabularies/{vocabulary_id}
    method: get
    sdk: VocabularyService.Get
    documented_response: ref:Vocabulary
    actual_response: data-envelope
  - path: /vocabularies/{vocabulary_id}
    method: patch
    sdk: VocabularyService.Update
    documented_response: ref:Vocabulary
    actual_response: data-envelope
  - path: /vocabularies/{vocabulary_id}
    method: delete
    sdk: VocabularyService.Delete
    documented_response: none
    actual_response: none

  # --- Tag aliases (not on this tree) -----------------------------------------
  - path: /tag-aliases
    method: get
    unimplemented: &not_ported_94 >-
      Not ported to this line. The tree implements two of the eight resource
      groups the contracts publish, tags and vocabularies; the other resource
      groups are hand-ported from main under epic #88, and #94 carries this one.
      Replace this reason with the method's name in the PR that adds it.
    documented_response: array
    actual_response: list-envelope
  - path: /tag-aliases
    method: post
    unimplemented: *not_ported_94
    documented_response: ref:TagAlias
    actual_response: data-envelope
  - path: /tag-aliases/{alias_id}
    method: get
    unimplemented: *not_ported_94
    documented_response: ref:TagAlias
    actual_response: data-envelope
  - path: /tag-aliases/{alias_id}
    method: patch
    unimplemented: *not_ported_94
    documented_response: ref:TagAlias
    actual_response: data-envelope
  - path: /tag-aliases/{alias_id}
    method: delete
    unimplemented: *not_ported_94
    documented_response: none
    actual_response: none
  - path: /tags/{tag_id}/aliases
    method: get
    unimplemented: *not_ported_94
    documented_response: array
    actual_response: list-envelope

  # --- Tag resolution (not on this tree) --------------------------------------
  - path: /tag-resolution
    method: get
    # One specialized read: no list, no writes. `scope` is a query parameter here
    # and nowhere else, and it is one of the few things #90's refresh added to
    # docs/openapi.yaml.
    unimplemented: *not_ported_94
    documented_response: ref:TagResolution
    actual_response: data-envelope

  # --- Assignments (not on this tree) -----------------------------------------
  - path: /tag-assignments
    method: post
    unimplemented: *not_ported_94
    documented_response: ref:Assignment
    actual_response: data-envelope
  - path: /tag-assignments
    method: delete
    # A DELETE that carries a body; the ids travel in it rather than in the path.
    unimplemented: *not_ported_94
    undocumented_request_body: >-
      The ids travel in the payload rather than the path, and the generated spec
      documents no requestBody for a DELETE at all — drf-spectacular does not emit
      one for that method. A fourth divergence in the same family as the two
      response envelopes and the bulk composites: verified against a running
      server, where the body is what the endpoint reads.
    documented_response: none
    actual_response: none
  - path: /tag-assignments/bulk-assign
    method: post
    # The spec claims a bare array. The server returns
    # {"data": {"created": N, "existing": N, "skipped": N, "assignments": [...]}} —
    # a composite, not a page, so it carries no pagination block.
    unimplemented: *not_ported_94
    documented_response: array
    actual_response: composite-envelope
    composite_body: '{"created": 1, "existing": 2, "skipped": 3, "assignments": [{"id": "11111111-1111-4111-8111-111111111111", "tenant_id": "cd~tenant_id", "application_id": "cd~application_id", "namespace_type": "cd~namespace_type", "namespace_id": "cd~namespace_id", "tag_id": "22222222-2222-4222-8222-222222222222", "resource_type": "cd~resource_type", "resource_id": "cd~resource_id", "assigned_by": "cd~assigned_by", "assigned_at": "2026-01-02T03:04:05Z"}]}'
  - path: /tag-assignments/bulk-remove
    method: post
    # The spec documents NO response schema at all. The server returns
    # {"data": {"removed": N}}.
    unimplemented: *not_ported_94
    documented_response: none
    actual_response: composite-envelope
    composite_body: '{"removed": 4}'

  # --- Resource tags (not on this tree) ---------------------------------------
  - path: /resources/{resource_type}/{resource_id}/tags
    method: get
    unimplemented: *not_ported_94
    documented_response: array
    actual_response: list-envelope
  - path: /resources/{resource_type}/{resource_id}/tags
    method: post
    # Composite replace, not an append: same bare-array claim as bulk-assign, same
    # composite body in reality.
    unimplemented: *not_ported_94
    documented_response: array
    actual_response: composite-envelope
    composite_body: '{"created": 5, "removed": 6, "tags": [{"id": "33333333-3333-4333-8333-333333333333", "tenant_id": "cd~tenant_id", "application_id": "cd~application_id", "namespace_type": "cd~namespace_type", "namespace_id": "cd~namespace_id", "name": "cd~name", "slug": "cd~slug", "type": "cd~type", "description": "cd~description", "parent_id": "44444444-4444-4444-8444-444444444444", "vocabulary_id": "55555555-5555-4555-8555-555555555555", "metadata": {"cd~metadata": "value"}, "is_active": true, "usage_count": 7, "created_at": "2026-01-02T03:04:05Z", "updated_at": "2026-01-03T03:04:05Z"}]}'
  - path: /tags/{tag_id}/resources
    method: get
    unimplemented: *not_ported_94
    documented_response: array
    actual_response: list-envelope

  # --- Audit logs (not on this tree) ------------------------------------------
  # List-only, on all three routes. There is no Get.
  - path: /audit-logs
    method: get
    unimplemented: *not_ported_94
    documented_response: array
    actual_response: list-envelope
  - path: /tags/{tag_id}/audit-logs
    method: get
    unimplemented: *not_ported_94
    documented_response: array
    actual_response: list-envelope
  - path: /resources/{resource_type}/{resource_id}/audit-logs
    method: get
    unimplemented: *not_ported_94
    documented_response: array
    actual_response: list-envelope

  # --- Health (not on this tree) ----------------------------------------------
  # Outside /api/<version>, unauthenticated, and no envelope: a bare
  # {"status": "ok"}. The spec documents a 200 with no content at all, which is why
  # both rows read `none` -> `bare` rather than `none` -> `none`.
  - path: /health/live
    method: get
    unimplemented: &not_ported_91 >-
      Not ported to this line. The health probes come with the compat core, #91,
      rather than with the resource groups, because they need a request path of
      their own: they sit outside /api/<version>, authenticate nobody, and carry
      no data envelope, so neither doData's envelope requirement nor New's
      credential validation may be loosened to fit them. Replace this reason with
      the method's name in the PR that adds it.
    documented_response: none
    actual_response: bare
  - path: /health/ready
    method: get
    unimplemented: *not_ported_91
    documented_response: none
    actual_response: bare
