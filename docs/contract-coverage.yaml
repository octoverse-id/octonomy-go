# Octonomy contract coverage — the SDK's own statement about the contract it vendors.
#
# READ BY `tools/contractdrift` (see docs/development.md#contract-drift). This is a
# checked file, not a hand-maintained document: every row is asserted against
# docs/openapi.yaml, docs/openapi-v2.yaml, and AGAINST THE CLIENT ITSELF — the gate
# calls each operation's method and reads the request off the wire — on every run
# of `make contract-check`, which CI runs on every pull request.
#
# Each implemented row needs a driver in tools/contractdrift/drivers.go that calls
# its method with every parameter populated. A row with no driver is an operation
# nobody exercises, and the gate says so.
#
# `sdk:` is the human-facing label. The gate checks the method exists; the driver
# is what proves what it does.
#
# WHY IT EXISTS. An endpoint nobody implemented and an endpoint nobody noticed look
# identical from the outside, and that is how this SDK came to sit on a server 1.0.0
# contract while the server shipped 3.1.0 with a second, primary API surface. A row
# here turns "not implemented" into a decision with a reason attached. The gate fails
# when the contract publishes an operation this file does not list, so a new endpoint
# cannot arrive unnoticed whether or not anyone means to implement it.
#
# PATHS ARE VERSION-INDEPENDENT SUFFIXES — `/tags`, never `/api/v2/tags`. The SDK's
# resource files build exactly that suffix and the transport prepends
# `/api/<version>`, so one row covers both surfaces and a surface that publishes an
# operation the other does not is itself reported as drift.
#
# THE TWO RESPONSE FIELDS ARE THE RECORDED DIVERGENCE, and they are the reason this
# gate does not flag the envelopes on every run.
#
#   documented_response   what the VENDORED spec says the success body is:
#                         `array`, `ref:<Schema>`, `none`, or `other`. Checked
#                         against the spec.
#   actual_response       what the running server really returns, in the SDK's own
#                         vocabulary: `list-envelope` ({data, pagination}),
#                         `data-envelope` ({data: {...}}), `composite-envelope`
#                         ({data: {...counts, items}}), `bare` (no envelope at all),
#                         or `none` (204, no body). This is not a label: it is what
#                         the gate's stub WRAPS ITS BODY IN when it answers the
#                         real client, so a row naming the wrong envelope usually
#                         hands the client a shape it cannot decode and the run
#                         fails. Usually, not always — a method that decodes no
#                         payload is not asked to read one, though `client.do` does
#                         still require exactly 204. So this is a REVIEWED FACT,
#                         established against a running server, rather than a
#                         conclusion this gate reaches on its own.
#
# Where the two differ, THE SERVER WINS — always, and it is not close. The spec is
# generated by drf-spectacular from the serializers, and the envelope is added by a
# renderer that sits below them, so the generator cannot see it; every `actual_response`
# below was verified against a booted server rather than read off the spec. The SDK
# decodes the server's shape (`doData`/`doList` in transport.go), and a decoder written
# from the spec instead returns a zero-valued struct or an empty page with a nil error —
# issues #32 and #40, the same silent-success family, twice.
#
# The gate asserts each side against its own source — `documented_response` against
# the spec, `actual_response` against the client, which has to decode a body wrapped
# in it — and never against each other. That is what keeps the divergence quiet
# while it holds, and what makes it speak up on the day the server's generator
# learns about the renderer: the day the SDK can stop carrying a documented
# workaround.
#
# Where a response carries a plain resource, the body the stub sends is built FROM
# the contract's schema, so decoding it is a direct test of the model: a property
# with no field is dropped on the way back out, and a property whose type the model
# cannot read does not decode at all. Not every retype is one it cannot read — an
# `integer` into a float still decodes — and docs/development.md records that limit. The composites and the health probes sit out of that,
# since the spec describes none of them correctly — that is the divergence,
# recorded above rather than reported every run.

operations:
  # --- Tags (tags.go) ---------------------------------------------------------
  - path: /tags
    method: get
    sdk: TagService.List
    documented_response: array
    actual_response: list-envelope
  - path: /tags
    method: post
    sdk: TagService.Create
    documented_response: ref:Tag
    actual_response: data-envelope
  - path: /tags/{tag_id}
    method: get
    sdk: TagService.Get
    documented_response: ref:Tag
    actual_response: data-envelope
  - path: /tags/{tag_id}
    method: patch
    sdk: TagService.Update
    documented_response: ref:Tag
    actual_response: data-envelope
  - path: /tags/{tag_id}
    method: delete
    # Deactivation on the server, not a hard delete. 204, no body either way.
    sdk: TagService.Delete
    documented_response: none
    actual_response: none

  # --- Vocabularies (vocabularies.go) -----------------------------------------
  - path: /vocabularies
    method: get
    sdk: VocabularyService.List
    documented_response: array
    actual_response: list-envelope
  - path: /vocabularies
    method: post
    sdk: VocabularyService.Create
    documented_response: ref:Vocabulary
    actual_response: data-envelope
  - path: /vocabularies/{vocabulary_id}
    method: get
    sdk: VocabularyService.Get
    documented_response: ref:Vocabulary
    actual_response: data-envelope
  - path: /vocabularies/{vocabulary_id}
    method: patch
    sdk: VocabularyService.Update
    documented_response: ref:Vocabulary
    actual_response: data-envelope
  - path: /vocabularies/{vocabulary_id}
    method: delete
    sdk: VocabularyService.Delete
    documented_response: none
    actual_response: none

  # --- Tag aliases (aliases.go) -----------------------------------------------
  - path: /tag-aliases
    method: get
    sdk: AliasService.List
    documented_response: array
    actual_response: list-envelope
  - path: /tag-aliases
    method: post
    sdk: AliasService.Create
    documented_response: ref:TagAlias
    actual_response: data-envelope
  - path: /tag-aliases/{alias_id}
    method: get
    sdk: AliasService.Get
    documented_response: ref:TagAlias
    actual_response: data-envelope
  - path: /tag-aliases/{alias_id}
    method: patch
    sdk: AliasService.Update
    documented_response: ref:TagAlias
    actual_response: data-envelope
  - path: /tag-aliases/{alias_id}
    method: delete
    sdk: AliasService.Delete
    documented_response: none
    actual_response: none
  - path: /tags/{tag_id}/aliases
    method: get
    sdk: TagService.ListAliases
    documented_response: array
    actual_response: list-envelope

  # --- Tag resolution (resolution.go) -----------------------------------------
  - path: /tag-resolution
    method: get
    # One specialized read: no list, no writes. `scope` is a query parameter here
    # and nowhere else, which is the parameter the drift that prompted this gate
    # added without anyone noticing.
    sdk: TagService.Resolve
    documented_response: ref:TagResolution
    actual_response: data-envelope

  # --- Assignments (assignments.go) -------------------------------------------
  - path: /tag-assignments
    method: post
    sdk: AssignmentService.Create
    documented_response: ref:Assignment
    actual_response: data-envelope
  - path: /tag-assignments
    method: delete
    # A DELETE that carries a body; the ids travel in it rather than in the path.
    sdk: AssignmentService.Remove
    undocumented_request_body: >-
      The ids travel in the payload rather than the path, and the generated spec
      documents no requestBody for a DELETE at all — drf-spectacular does not emit
      one for that method. A fourth divergence in the same family as the two
      response envelopes and the bulk composites: verified against a running
      server, where the body is what the endpoint reads.
    documented_response: none
    actual_response: none
  - path: /tag-assignments/bulk-assign
    method: post
    # The spec claims a bare array. The server returns
    # {"data": {"created": N, "existing": N, "skipped": N, "assignments": [...]}} —
    # a composite, not a page, so it carries no pagination block and decodes through
    # doData rather than doList.
    sdk: AssignmentService.BulkAssign
    documented_response: array
    actual_response: composite-envelope
  - path: /tag-assignments/bulk-remove
    method: post
    # The spec documents NO response schema at all. The server returns
    # {"data": {"removed": N}}.
    sdk: AssignmentService.BulkRemove
    documented_response: none
    actual_response: composite-envelope

  # --- Resource tags (resources.go) -------------------------------------------
  - path: /resources/{resource_type}/{resource_id}/tags
    method: get
    sdk: ResourceService.ListTags
    documented_response: array
    actual_response: list-envelope
  - path: /resources/{resource_type}/{resource_id}/tags
    method: post
    # Composite replace, not an append: same bare-array claim as bulk-assign, same
    # composite body in reality.
    sdk: ResourceService.ReplaceTags
    documented_response: array
    actual_response: composite-envelope
  - path: /tags/{tag_id}/resources
    method: get
    sdk: TagService.ListResources
    documented_response: array
    actual_response: list-envelope

  # --- Audit logs (audit.go) --------------------------------------------------
  # List-only, on all three routes. There is no Get.
  - path: /audit-logs
    method: get
    sdk: AuditLogService.List
    documented_response: array
    actual_response: list-envelope
  - path: /tags/{tag_id}/audit-logs
    method: get
    sdk: TagService.ListAuditLogs
    documented_response: array
    actual_response: list-envelope
  - path: /resources/{resource_type}/{resource_id}/audit-logs
    method: get
    sdk: ResourceService.ListAuditLogs
    documented_response: array
    actual_response: list-envelope

  # --- Health (health.go) -----------------------------------------------------
  # Outside /api/<version>, unauthenticated, and no envelope: a bare
  # {"status": "ok"}. The spec documents a 200 with no content at all, which is why
  # both rows read `none` -> `bare` rather than `none` -> `none`.
  - path: /health/live
    method: get
    sdk: HealthService.Live
    documented_response: none
    actual_response: bare
  - path: /health/ready
    method: get
    sdk: HealthService.Ready
    documented_response: none
    actual_response: bare

# Documented inputs the client does not send — a query parameter, a request-body
# property, or a header.
# Each needs a reason, because the alternative reading — nobody implemented it —
# is the failure this gate exists to catch. `scope` on /tag-resolution is the
# worked example of the other outcome: it belonged in the client, it is
# implemented, and it is correctly absent from this list.
#
# Rows are keyed by OPERATION AND LOCATION, not by name. A name is not a decision:
# `limit` would be legitimately unsent on /tag-resolution and is legitimately sent
# on every list route, and `resource_type` is legitimately absent from a body while
# being required in the path. A name-keyed allowlist would silence all of them.
#
# The two below are a real gap, not a decision — and this gate found them. The
# first draft compared parameter names against the whole package, which read `q`
# and `slug` as implemented because tags.go sends them; the per-operation check
# that replaced it surfaced exactly the gap #36 already records. They stay listed
# rather than fixed here because adding two exported fields is a client change,
# not a CI one.
unsent_inputs:
  - path: /vocabularies
    method: get
    in: query
    name: q
    reason: >-
      VocabularyListParams has no free-text search field. On GET /vocabularies
      since server 1.0.0, so this is a gap against a contract the SDK already
      vendored rather than v2 drift; TagListParams carries the matching pair.
      Tracked in https://github.com/octoverse-id/octonomy-go/issues/36 and in
      docs/roadmap.md.
  - path: /vocabularies
    method: get
    in: query
    name: slug
    reason: >-
      The other half of the same gap. See the row above and
      https://github.com/octoverse-id/octonomy-go/issues/36.

  # The rest of this list is ONE RULE, applied eleven times, and it is a decision
  # rather than a gap: every write documents `application_id` as a query parameter
  # and the SDK sends it in the body instead. The rows exist because the gate reads
  # the wire — so the rule has to be stated somewhere it can be checked, and if the
  # SDK ever starts putting it on the query string, all eleven turn into stale-row
  # findings at once.
  #
  # The reason is written once and referenced, so it cannot rot in ten copies —
  # and `carried_in: body` is not prose at all: the gate requires the property to
  # really be in that request's payload, so each row proves its own replacement
  # path instead of merely asserting one.
  - path: /tags
    method: post
    in: query
    name: application_id
    carried_in: body
    reason: &application_id_in_body >-
      Application scope follows the body on a request that has one, so the SDK
      refuses WithApplication here and the value travels in the write struct's
      ApplicationID instead. Probed against 3.1.0: the server keeps a query
      application_id on a namespaced create and DROPS it on a global one, while a
      body application_id wins in both — so honoring the option would silently
      produce a tenant-shared row for a caller who asked for application scope.
      The parameter is reachable, just not through the query string.
  - path: /tags/{tag_id}
    method: patch
    in: query
    name: application_id
    carried_in: body
    reason: *application_id_in_body
  - path: /vocabularies
    method: post
    in: query
    name: application_id
    carried_in: body
    reason: *application_id_in_body
  - path: /vocabularies/{vocabulary_id}
    method: patch
    in: query
    name: application_id
    carried_in: body
    reason: *application_id_in_body
  - path: /tag-aliases
    method: post
    in: query
    name: application_id
    carried_in: body
    reason: *application_id_in_body
  - path: /tag-aliases/{alias_id}
    method: patch
    in: query
    name: application_id
    carried_in: body
    reason: *application_id_in_body
  - path: /tag-assignments
    method: post
    in: query
    name: application_id
    carried_in: body
    reason: *application_id_in_body
  - path: /tag-assignments/bulk-assign
    method: post
    in: query
    name: application_id
    carried_in: body
    reason: *application_id_in_body
  - path: /tag-assignments/bulk-remove
    method: post
    in: query
    name: application_id
    carried_in: body
    reason: *application_id_in_body
  - path: /resources/{resource_type}/{resource_id}/tags
    method: post
    in: query
    name: application_id
    carried_in: body
    reason: *application_id_in_body
  - path: /tag-assignments
    method: delete
    in: query
    name: application_id
    carried_in: body
    reason: >-
      The one DELETE that carries a body — the ids travel in it rather than in the
      path — so the same body-wins rule applies: AssignmentRemove.ApplicationID is
      how this is set, and WithApplication is refused on any request with a body.

  # Two properties the request schema documents that the ROUTE already carries.
  - path: /resources/{resource_type}/{resource_id}/tags
    method: post
    in: body
    name: resource_type
    reason: &resource_in_path >-
      The route names it — POST /resources/{resource_type}/{resource_id}/tags —
      so ResourceService.ReplaceTags takes it as an argument and puts it in the
      path. The generated schema documents it in the body as well because the
      serializer declares both, but sending it twice invites the two to disagree,
      and the path is the half the server routes on.
  - path: /resources/{resource_type}/{resource_id}/tags
    method: post
    in: body
    name: resource_id
    reason: *resource_in_path

# Headers the client puts on EVERY versioned request that no operation documents.
#
# They are transport identity rather than per-operation input: the contract's
# parameter lists describe what varies per call, and drf-spectacular never
# documents the ones the auth layer requires. Recorded once here rather than
# twenty-seven times, and still checked — the gate reports any OTHER undocumented
# header the client starts sending.
client_headers:
  - name: X-Tenant-ID
    reason: >-
      Required on every request on the versioned API (Config.TenantID) and enforced
      server-side by middleware rather than by any one view, so no operation
      documents it. AGENTS.md: every request on the versioned API is tenant-scoped.
  - name: Authorization
    reason: >-
      The bearer token, on every versioned request and enforced by the auth layer
      rather than by any one view. Listed here for the other half of the rule: the
      gate requires each of these on every versioned operation and FORBIDS them on
      the unversioned probes, which authenticate nobody — so a token leaking onto
      /health is a finding rather than an absence.

# JSON fields an SDK response model decodes that the contract's schema does not
# document. The gate compares each decoded model with the schema behind the
# operation's success body, so a field on one side and not the other is reported
# unless it is recorded here.
#
# Empty today: every field the models decode is documented.
undocumented_model_fields: []

# The server's error registry, vendored the way the two OpenAPI contracts are — and
# for the same reason. These codes are not in the contracts: `ErrorResponse` types
# `code` as a bare string, so a schema comparison cannot see a single one of them.
# Without a copy here, the only possible check would be errors.go against the
# server's own octonomy/core/errors.py, which needs the network and runs weekly —
# leaving error codes as the one item on #18's list where "refresh now, implement
# later" was still a state this repository could be left in.
#
# Vendoring turns one unverifiable hop into two checked ones: this list against
# errors.go on every pull request, and this list against the real registry on the
# schedule. Each hop names which side moved.
server_error_codes:
  - ambiguous_resolution
  - application_mismatch
  - authentication_required
  - conflict
  - forbidden
  - inactive_tag
  - namespace_api_disabled
  - namespace_invalid
  - namespace_not_supported
  - namespaced_writes_disabled
  - not_found
  - scope_immutable
  - tenant_mismatch
  - validation_error

# Code* constants in errors.go with no counterpart in the registry above. Every
# other constant must appear there, and every code in it must have a constant —
# the gate checks both directions, and refuses a code listed in both places.
sdk_only_error_codes:
  - code: unexpected_status
    reason: >-
      SDK-synthesized, never sent by the server. It is the code on an *APIError built
      from a non-2xx that arrived WITHOUT the Octonomy error envelope — a proxy 502, an
      unrouted 404 from a server with no /api/v2. Mapping such a response to a semantic
      code is what made IsNotFound(err) true for "this deployment has no v2 route",
      which a caller's ordinary not-found branch reads as an empty taxonomy.
  - code: not_ready
    reason: >-
      SDK's name for a state the server expresses as a status plus a body, not a string
      it ever sends. /health/ready answers 503 {"status": "unavailable"}; the health
      view has no error envelope and therefore no code of its own.
