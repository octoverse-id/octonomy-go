name: Bug report
description: Report a problem with the Octonomy Go SDK.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal Go snippet, the SDK call(s) made, and the observed result.
      render: go
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error or APIError details
      description: The returned error string, and APIError fields (Code, StatusCode, RequestID) if applicable.
      render: text
    validations:
      required: false
  - type: dropdown
    id: module-line
    attributes:
      label: Which module are you importing?
      description: The two release lines are different modules with different Go floors and support policies.
      options:
        - github.com/octoverse-id/octonomy-go/v2 (modern line, Go 1.24+)
        - github.com/octoverse-id/octonomy-go (compat line, v1.x, Go 1.13, security fixes only)
    validations:
      required: true
  - type: input
    id: sdk-version
    attributes:
      label: SDK version / commit
      description: 'e.g. v1.0.0, v2.0.0-alpha.1, a pseudo-version, or a commit SHA. There has never been a v0.x.'
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Go version (`go version`), OS/arch, and the Octonomy server version you target.
    validations:
      required: false
