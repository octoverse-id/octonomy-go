name: CI

# The compat line had ZERO CI before this: the lists below named only `main`, so
# nothing ran on `support/go1.13` and the guard job could never fire. The tag
# trigger matters for the same reason -- a release tag is cut on this branch, and
# GitHub resolves workflows for a tag push from the tagged commit, which is this
# file.
on:
  push:
    branches: [main, support/go1.13]
    tags: ["v*"]
  pull_request:
    branches: [main, support/go1.13]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true
      - name: gofmt check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needs to run on:"; echo "$out"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      # The contract gate (tools/contractdrift, #98) is its own module, which
      # `golangci-lint run` at the root stops short of exactly as `go vet ./...`
      # does. AGENTS.md promises a golangci-lint-clean tree, and a directory
      # nothing lints is where that stops being true quietly. Same config,
      # second invocation.
      - name: golangci-lint (contract gate)
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: tools/contractdrift
          args: --config ../../.golangci.yml

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.24", "1.25"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          # The SDK module has no go.sum (it is standard-library only); the
          # contract gate's module is the one in the repository.
          cache-dependency-path: tools/contractdrift/go.sum
      - name: Build
        run: go build ./...
      - name: Build examples
        run: go build ./examples/...
      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...
      # The contract gate (#98): main's tools/contractdrift, ported. It CALLS each
      # method the inventory names against a stub built from the vendored schema
      # and compares what went on the wire, and what came back, with the
      # contract -- on both REST surfaces.
      #
      # Steps in this job rather than a job of their own: a new job's check
      # context blocks nothing until branch protection names it, and a gate that
      # can go red without stopping a merge is the advisory state #97 kept the
      # isolation suite out of. The gate's module declares go 1.24, which both
      # matrix entries satisfy -- so it is also proven to build at its floor.
      #
      # First that the gate still works, then what it says: a drift gate never
      # shown to fail cannot be told apart from one that cannot.
      - name: Test the contract gate
        run: make contract-test
      - name: Check the vendored contract against the SDK
        run: make contract-check

  # THE ONLY GATE ON THIS LINE'S STDLIB FLOOR.
  #
  # A modern toolchain enforces the *language* version from the `go` directive
  # but not the *stdlib* version: with `go 1.13` in go.mod, Go 1.25 rejects
  # generics and compiles `io.ReadAll` (Go 1.16) clean -- as do `go vet`,
  # `go vet -stdversion`, and staticcheck. Only a real go1.13 toolchain catches
  # it. Nothing else in this workflow does, and neither does a contributor
  # running a current Go locally.
  #
  # Whether a red run here blocks a merge is branch-protection state, which this
  # file cannot observe, so it is deliberately not paraphrased here. The comment
  # that used to paraphrase it went stale the moment the contexts were added and
  # then misled a reviewer on PR #50, who read it and filed a finding against
  # documentation that was correct. Ask the API instead:
  #
  #   gh api 'repos/{owner}/{repo}/branches/support%2Fgo1.13/protection' \
  #     --jq '.required_status_checks.contexts'
  go113:
    name: go1.13
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go 1.13
        uses: actions/setup-go@v7
        with:
          go-version: "1.13.15"
          # MUST stay false. setup-go derives its cache path from
          # `go env GOMODCACHE`, and that variable does not exist before Go
          # 1.15 -- with caching on, this job fails for a reason that has
          # nothing to do with the code under test.
          cache: false
      - name: Build
        run: go build ./...
      - name: Build examples
        run: make examples
      - name: go vet
        run: go vet ./...
      # Deliberately NOT gofmt: Go 1.19 changed how gofmt formats doc comments,
      # so a 1.13 gofmt reports diffs against a tree the modern lint job
      # formatted. Formatting is that job's business; this one owns the floor.
      - name: Lower ASLR entropy for the 2020-era race runtime
        # `go test -race` links the race runtime that shipped with Go 1.13, and
        # sanitizer runtimes of that era abort with "unexpected memory mapping"
        # when the kernel hands out 32 bits of mmap randomness (Ubuntu 24.04's
        # default; 22.04 used 28). Lowering it back is the standard workaround
        # and is scoped to this ephemeral runner. Tolerated if the knob is
        # absent -- older images do not need it.
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || echo "::notice::vm.mmap_rnd_bits not settable; continuing"
      - name: Test (race)
        run: go test -race ./...

  # The mistag guard, split by severity (the two halves have different backstops).
  #
  # BLOCKING half -- the `go` directive on the compat line. Nothing else catches
  # it: a v1.x tag cut from this branch after the directive drifted carries the
  # same module path, so Go resolves it happily, a Go 1.13 consumer pulls it
  # inside their normal version range, and it does not compile. `retract` cannot
  # reach them (the directive shipped in Go 1.16), so the mistake is permanent.
  #
  # ADVISORY half -- path/branch/version consistency. Go rejects a module-path
  # mismatch itself ("go.mod has post-v1 module path ... at revision v1.0.0"),
  # so this is an early signal, not the gate.
  #
  # It runs on every push and PR for this line, which is what puts it on the
  # RELEASE PR. A tag-push-only check fires after the tag is already
  # proxy-resolvable -- it would report a mistake it cannot undo.
  compat-guard:
    name: compat guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, for the contract gate's identity check below: it has to
          # decide whether the commit tools/contractdrift/main.pin names is on
          # main, and a shallow clone cannot answer that -- the script refuses one
          # rather than guess.
          fetch-depth: 0
      - name: Assert the release line's go.mod invariants
        run: make compat-guard
      - name: The guard's own tests
        # Every run on an ordinary branch has GITHUB_HEAD_REF=<type>/<issue>-...,
        # so CI never executes the release-PR block on the one PR where it
        # matters most -- the release PR runs it for the first time. These
        # fixtures exercise that path, and the tag paths, on every run.
        run: make compat-guard-test
      # The contract gate's shared files against main's (#98). Five files of
      # tools/contractdrift are main's byte for byte at a PINNED commit, so
      # divergence is impossible rather than merely discouraged -- and pinned
      # rather than main's tip, so a merge on main cannot turn an unchanged
      # commit here red. It belongs in this job because it is the same kind of
      # check as the one above: what this line may and may not differ from main
      # in. Fetches only from this repository.
      - name: The contract gate's shared files match main at the pin
        run: make contract-identity
      - name: The identity check's own tests
        run: make contract-identity-test

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true
      # Installed and run as two explicit steps rather than through
      # golang/govulncheck-action, which cannot express the one thing this job
      # needs. The action hardcodes `go install golang.org/x/vuln/...@latest`
      # with no version input, and actions/setup-go exports GOTOOLCHAIN=local so
      # that a pinned Go really is the Go used -- so the moment x/vuln raised its
      # own go directive past the pinned version, the install failed and the scan
      # never ran. x/vuln v1.8.0 (2026-09-08) requires go >= 1.26.0, and this
      # line has failed on `requires go >= 1.26.0 (running go 1.25.x;
      # GOTOOLCHAIN=local)` on every run since. It broke here silently: this
      # branch's previous run was 2026-08-26, cutting v1.0.0.
      #
      # Dropping the action costs nothing else: the job already checks out and
      # sets up Go above, and the action's own copies of both were redundant
      # (its checkout was already disabled here, because a second one leaves two
      # credential configs in place and the fetch fails with
      # `Duplicate header: "Authorization"` and HTTP 400).
      - name: Install govulncheck
        # GOTOOLCHAIN=auto lets the go command fetch whatever toolchain is needed
        # to BUILD the scanner. It is set inline, in the shell, rather than in an
        # `env:` block, so it cannot be silently re-overridden by the
        # GOTOOLCHAIN=local that setup-go exports into the job environment.
        #
        # It applies to the install ONLY, which is the whole point: the binary it
        # produces still analyzes this module with the Go pinned above (verified
        # -- govulncheck -version reports `Go: go1.25.x` alongside
        # `Scanner: govulncheck@v1.8.0`). Scanning with a newer stdlib than the
        # one under test would hide exactly the standard-library advisories this
        # job exists to surface.
        #
        # @latest, not a pin: a pinned scanner ages into the same failure from
        # the other direction, and the vulnerability database is fetched from
        # vuln.go.dev at run time regardless, so a newer tool is strictly better
        # here. With GOTOOLCHAIN=auto the version ratchet can no longer break it.
        run: GOTOOLCHAIN=auto go install golang.org/x/vuln/cmd/govulncheck@latest
      # Deliberately NOT `make vuln`: that target SKIPS when the binary is absent,
      # which is right on a laptop and is exactly the wrong behavior here -- a
      # failed install would report a green scan that never happened. Calling the
      # binary directly makes a missing one a failing step.
      #
      # Two invocations, because `./...` stops at a go.mod boundary and this
      # line has two modules since #98: the SDK, and the contract gate in
      # tools/contractdrift. A third module would need a third step -- nothing
      # about either command reports one it did not reach.
      - name: govulncheck
        run: govulncheck ./...
      # The gate's module carries the repository's only third-party dependency
      # (gopkg.in/yaml.v3). That it never reaches a consumer's build is a
      # statement about the dependency graph, not a reason to leave it
      # unscanned.
      - name: govulncheck (contract gate)
        working-directory: tools/contractdrift
        run: govulncheck ./...

  # THE COMPAT LINE'S ONLY CHECK AGAINST A REAL SERVER.
  #
  # Two suites run here against one booted harness: the smoke test (does the
  # client decode what the server sends?) and, since #97, the namespace
  # isolation suite (does the server keep one merchant's rows from another?).
  #
  # It replaces the bootstrap-only `harness` job this workflow was forked from:
  # on this line the two suites below ARE the harness's consumers, so booting a
  # container to assert only that the container booted would be a second Docker
  # job for no added coverage. The credentials still cross a step boundary (the
  # harness exports them, the test steps read them), which is what that job was
  # proving.
  #
  # Why it is worth blocking a merge on -- the part that does not decay: a flake
  # costs a re-run, while an unverified `v1.x` tag cannot be recalled at all
  # (`retract` shipped in Go 1.16, after this line's floor). #29 makes a green smoke test a
  # precondition for cutting the tag, and a `continue-on-error` job cannot
  # satisfy a precondition. As with the go113 job, what is actually enforced
  # lives in the branch's protection settings, not in this file.
  smoke:
    name: go1.13 smoke test
    runs-on: ubuntu-latest
    # Docker pull + migrations + readiness, then the two suites, which take
    # seconds against a healthy server. This is a cap on the whole job, not a
    # diagnosis: the harness's own gates are bounded well inside it, but the
    # suites' deadlines are per phase -- each seed, each matrix, each teardown
    # step -- and together exceed it, so a hang and a server slow for long
    # enough can both reach it first.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go 1.13
        uses: actions/setup-go@v7
        with:
          go-version: "1.13.15"
          # See the go113 job: GOMODCACHE does not exist before Go 1.15.
          cache: false
      - name: Boot the Octonomy harness
        uses: ./.github/actions/octonomy-harness
      - name: Smoke test against the real server
        # This line's client on its own toolchain against the current server --
        # the only combination that proves this line still works. It caught the
        # single-resource {"data": ...} envelope that every canned httptest body
        # had been getting wrong.
        env:
          # Without this the test SKIPS when OCTONOMY_TEST_BASE_URL is absent,
          # and a skip is a green job. The composite action checks only that the
          # env file exists, not that the variables survived $GITHUB_ENV -- so a
          # broken export would leave this job, the line's only check against a
          # real server, reporting success without running a single assertion,
          # here and in the isolation step below. Required mode turns that
          # absence into a failure in both.
          OCTONOMY_SMOKE_REQUIRED: "1"
        run: go test -tags=integration -count=1 -run '^TestSmoke_' -v ./...
      # The namespace isolation suite (#97): every authenticated read method,
      # asked whether a merchant-A client can see a merchant-B row, under the
      # per-merchant exact grants the harness mints. It is a step of THIS job
      # rather than a job of its own because this job is already a required
      # check: a new job would report green on every PR until branch protection
      # named it, and an isolation test that runs in an advisory job -- or in no
      # job, as a port whose selector nothing matched would have -- is a test
      # that asserts nothing. The harness above serves both steps.
      #
      # Its own selector, not the smoke step's: `^TestSmoke_` matches no
      # isolation test. TestTheIsolationSuiteRunsItsProbes holds the suite to
      # this prefix, and OCTONOMY_SMOKE_REQUIRED turns loadHarness's skip into a
      # failure exactly as it does newSmokeClient's.
      - name: Namespace isolation suite against the real server
        env:
          OCTONOMY_SMOKE_REQUIRED: "1"
        run: go test -tags=integration -count=1 -run '^TestIntegration_' -v ./...
      - name: Capture container logs
        if: failure()
        run: make dev-server-logs
      - name: Tear down the harness
        if: always()
        run: make dev-server-down
