name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true
      - name: gofmt check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needs to run on:"; echo "$out"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      # The drift gate is a nested module, so the run above cannot see it: `./...`
      # stops at a go.mod boundary, and so do `go vet ./...` and `go build ./...`
      # in the test job. Only `gofmt -l .` above crosses it, because it walks the
      # filesystem rather than the package graph. AGENTS.md asks for a
      # golangci-lint-clean tree, and a directory nothing lints is where that stops
      # being true quietly. Same config, second invocation.
      - name: golangci-lint (contract drift gate)
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: tools/contractdrift
          args: --config ../../.golangci.yml

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.24", "1.25"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Build
        run: go build ./...
      - name: Build examples
        run: go build ./examples/...
      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...

  # The offline half of the contract drift gate (#18).
  #
  # BLOCKING, and safe to be: it compares the VENDORED contracts against this
  # repository and touches nothing outside the checkout. The cross-repository half
  # -- the same program with -upstream -- runs on a schedule in
  # contract-drift.yml, because a job that reaches into octoverse-id/octonomy can
  # go red for reasons that have nothing to do with the change under review, and a
  # merge gate that does that is one people learn to route around.
  #
  # What it catches on a pull request: an endpoint the vendored contract publishes
  # that docs/contract-coverage.yaml does not account for, an inventory row naming
  # a Go method that no longer exists, a documented query parameter the client
  # never sends, a recorded response shape the spec no longer matches, and
  # docs/versioning.md disagreeing with the specs about which server this SDK
  # targets. A contract refresh that lands without the follow-through fails here.
  #
  # NOTE: the required-context name is the display name, "contract inventory", not
  # the job id `contract`. Today main requires lint, test (1.24), test (1.25), and
  # vuln; add this one to make it block the merge rather than only the PR.
  contract:
    name: contract inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true
          # The gate lives in its own module (tools/contractdrift) so its YAML
          # parser is not a dependency of the SDK. That module's go.sum is the only
          # one in the repository.
          cache-dependency-path: tools/contractdrift/go.sum
      # First that the gate still works, then what it says. A drift gate that has
      # never been shown to fail cannot be told apart from one that cannot fail,
      # and these tests assert findings against deliberately modified contracts.
      - name: Test the gate
        run: make contract-test
      - name: Check the vendored contract against the SDK
        run: make contract-check

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true
      # Installed and run as two explicit steps rather than through
      # golang/govulncheck-action, which cannot express the one thing this job
      # needs. The action hardcodes `go install golang.org/x/vuln/...@latest`
      # with no version input, and actions/setup-go exports GOTOOLCHAIN=local so
      # that a pinned Go really is the Go used -- so the moment x/vuln raised its
      # own go directive past the pinned version, the install failed and the scan
      # never ran. x/vuln v1.8.0 (2026-09-08) requires go >= 1.26.0, and every
      # run since has failed on `requires go >= 1.26.0 (running go 1.25.x;
      # GOTOOLCHAIN=local)` -- on main as well as on PRs.
      #
      # Dropping the action costs nothing else: the job already checks out and
      # sets up Go above, and the action's own copies of both were redundant
      # (its checkout was already disabled here, because a second one leaves two
      # credential configs in place and the fetch fails with
      # `Duplicate header: "Authorization"`).
      - name: Install govulncheck
        # GOTOOLCHAIN=auto lets the go command fetch whatever toolchain is needed
        # to BUILD the scanner. It is set inline, in the shell, rather than in an
        # `env:` block, so it cannot be silently re-overridden by the
        # GOTOOLCHAIN=local that setup-go exports into the job environment.
        #
        # It applies to the install ONLY, which is the whole point: the binary it
        # produces still analyzes this module with the Go pinned above (verified
        # -- govulncheck -version reports `Go: go1.25.x` alongside
        # `Scanner: govulncheck@v1.8.0`). Scanning with a newer stdlib than the
        # one under test would hide exactly the standard-library advisories this
        # job exists to surface.
        #
        # @latest, not a pin: a pinned scanner ages into the same failure from
        # the other direction, and the vulnerability database is fetched from
        # vuln.go.dev at run time regardless, so a newer tool is strictly better
        # here. With GOTOOLCHAIN=auto the version ratchet can no longer break it.
        run: GOTOOLCHAIN=auto go install golang.org/x/vuln/cmd/govulncheck@latest
      # Deliberately NOT `make vuln`: that target SKIPS when the binary is absent,
      # which is right on a laptop and is exactly the wrong behavior here -- a
      # failed install would report a green scan that never happened. Calling the
      # binary directly makes a missing one a failing step.
      - name: govulncheck
        run: govulncheck ./...

  # The harness boot AND its only real consumer, in one job.
  #
  # It replaces the bootstrap-only `harness` job. That job asserted that the
  # container came up and that its credentials survived $GITHUB_ENV, which was
  # the right scope while its comment was true -- "It has no SDK code to
  # exercise yet". #32 is that SDK code. Booting a second container to assert
  # only that a container boots would be a second Docker job for no added
  # coverage, so the credential assertion stays here as a step and the smoke
  # test follows it.
  #
  # BLOCKING, dropping the `continue-on-error: true` the harness job carried.
  # That flag was hedging a new Docker job in the repo's most-patched area, with
  # the promotion condition written down: "before #17 depends on it for real
  # coverage". The condition arrived early. This is now the only check that sees
  # the server's real response shapes, and #32 is the proof that nothing else
  # catches a fixture-versus-server divergence -- a full unit suite stayed green
  # while every single-resource read returned an empty struct. An advisory job
  # would let the identical defect through again.
  #
  # NOTE: the required-context name is the job's DISPLAY name, "integration
  # smoke test", not the job id `smoke`. Add that string to main's
  # branch-protection required contexts -- dropping continue-on-error makes this
  # blocking on the PR, not on the merge. Today main requires lint, test (1.24),
  # test (1.25), and vuln; the advisory `harness` job was never among them, so
  # replacing it strands no required context.
  smoke:
    name: integration smoke test
    runs-on: ubuntu-latest
    # Every job needs an explicit bound. The default is 360 minutes, and a hung
    # readiness poll would otherwise sit on a runner for six hours. Docker pull
    # plus migrations plus readiness, then a sub-second test; the harness's own
    # gates are bounded well inside this, so hitting it means Docker or the
    # registry hung, not the server.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true
      - name: Boot the Octonomy harness
        uses: ./.github/actions/octonomy-harness
      - name: Assert the exported credentials work from a separate step
        # The point of this assertion is the step boundary. The harness proves
        # the environment works from inside its own process; this proves the
        # credentials survived the trip through $GITHUB_ENV, which is what the
        # smoke step below actually relies on. It reads back the namespaced row
        # the harness wrote, so it covers auth, tenancy, and the namespace axis
        # in one call -- the last of which the SDK cannot reach until #7.
        run: |
          set -euo pipefail
          # Bounded like every other request the harness makes: an unbounded
          # curl against a server that accepts but never answers would sit here
          # until the job timeout, 20 minutes away.
          body=$(curl -fsS --max-time 30 "${OCTONOMY_TEST_BASE_URL}/api/v2/vocabularies?application_id=${OCTONOMY_TEST_APPLICATION_ID}" \
            -H "Authorization: Bearer ${OCTONOMY_TEST_TOKEN}" \
            -H "X-Tenant-ID: ${OCTONOMY_TEST_TENANT_ID}" \
            -H "X-Namespace-Type: ${OCTONOMY_TEST_NAMESPACE_TYPE}" \
            -H "X-Namespace-ID: ${OCTONOMY_TEST_NAMESPACE_ID}")
          echo "$body"
          case "$body" in
            *harness-probe*) echo "harness credentials verified across the step boundary" ;;
            *) echo "::error::the namespaced read did not return the row the harness wrote"; exit 1 ;;
          esac
      - name: Smoke test against the real server
        env:
          # Without this the test SKIPS when OCTONOMY_TEST_BASE_URL is absent,
          # and a skip is a green job. The composite action checks only that the
          # env file exists, not that the variables survived $GITHUB_ENV -- so a
          # broken export would leave this job reporting success without running
          # a single assertion, which is precisely the vacuous-green shape #32
          # was hiding behind. Required mode turns that absence into a failure.
          OCTONOMY_SMOKE_REQUIRED: "1"
        # `make smoke` rather than an inline `go test`, so CI and a developer's
        # laptop run byte-identical logic -- including the guard that fails when
        # the test does not actually run. Two copies of this command would drift,
        # and the copy that drifts is the one nobody watches. The harness exports
        # its credentials through $GITHUB_ENV, so the target finds them in the
        # environment exactly as it finds them in .octonomy-harness.env locally.
        run: make smoke
      - name: Capture container logs
        if: failure()
        run: make dev-server-logs
      - name: Tear down the harness
        if: always()
        run: make dev-server-down
