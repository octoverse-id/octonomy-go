name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true
      - name: gofmt check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needs to run on:"; echo "$out"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.24", "1.25"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Build
        run: go build ./...
      - name: Build examples
        run: go build ./examples/...
      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.25"
          # The job already checked out above. Letting the action check out a
          # second time leaves two credential configs in place, and git sends
          # both -- the fetch then fails with `Duplicate header: "Authorization"`
          # and HTTP 400.
          repo-checkout: "false"

  # The harness boot AND its only real consumer, in one job.
  #
  # It replaces the bootstrap-only `harness` job. That job asserted that the
  # container came up and that its credentials survived $GITHUB_ENV, which was
  # the right scope while its comment was true -- "It has no SDK code to
  # exercise yet". #32 is that SDK code. Booting a second container to assert
  # only that a container boots would be a second Docker job for no added
  # coverage, so the credential assertion stays here as a step and the smoke
  # test follows it.
  #
  # BLOCKING, dropping the `continue-on-error: true` the harness job carried.
  # That flag was hedging a new Docker job in the repo's most-patched area, with
  # the promotion condition written down: "before #17 depends on it for real
  # coverage". The condition arrived early. This is now the only check that sees
  # the server's real response shapes, and #32 is the proof that nothing else
  # catches a fixture-versus-server divergence -- a full unit suite stayed green
  # while every single-resource read returned an empty struct. An advisory job
  # would let the identical defect through again.
  #
  # NOTE: the required-context name is the job's DISPLAY name, "integration
  # smoke test", not the job id `smoke`. Add that string to main's
  # branch-protection required contexts -- dropping continue-on-error makes this
  # blocking on the PR, not on the merge. Today main requires lint, test (1.24),
  # test (1.25), and vuln; the advisory `harness` job was never among them, so
  # replacing it strands no required context.
  smoke:
    name: integration smoke test
    runs-on: ubuntu-latest
    # Every job needs an explicit bound. The default is 360 minutes, and a hung
    # readiness poll would otherwise sit on a runner for six hours. Docker pull
    # plus migrations plus readiness, then a sub-second test; the harness's own
    # gates are bounded well inside this, so hitting it means Docker or the
    # registry hung, not the server.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true
      - name: Boot the Octonomy harness
        uses: ./.github/actions/octonomy-harness
      - name: Assert the exported credentials work from a separate step
        # The point of this assertion is the step boundary. The harness proves
        # the environment works from inside its own process; this proves the
        # credentials survived the trip through $GITHUB_ENV, which is what the
        # smoke step below actually relies on. It reads back the namespaced row
        # the harness wrote, so it covers auth, tenancy, and the namespace axis
        # in one call -- the last of which the SDK cannot reach until #7.
        run: |
          set -euo pipefail
          # Bounded like every other request the harness makes: an unbounded
          # curl against a server that accepts but never answers would sit here
          # until the job timeout, 20 minutes away.
          body=$(curl -fsS --max-time 30 "${OCTONOMY_TEST_BASE_URL}/api/v2/vocabularies?application_id=${OCTONOMY_TEST_APPLICATION_ID}" \
            -H "Authorization: Bearer ${OCTONOMY_TEST_TOKEN}" \
            -H "X-Tenant-ID: ${OCTONOMY_TEST_TENANT_ID}" \
            -H "X-Namespace-Type: ${OCTONOMY_TEST_NAMESPACE_TYPE}" \
            -H "X-Namespace-ID: ${OCTONOMY_TEST_NAMESPACE_ID}")
          echo "$body"
          case "$body" in
            *harness-probe*) echo "harness credentials verified across the step boundary" ;;
            *) echo "::error::the namespaced read did not return the row the harness wrote"; exit 1 ;;
          esac
      - name: Smoke test against the real server
        env:
          # Without this the test SKIPS when OCTONOMY_TEST_BASE_URL is absent,
          # and a skip is a green job. The composite action checks only that the
          # env file exists, not that the variables survived $GITHUB_ENV -- so a
          # broken export would leave this job reporting success without running
          # a single assertion, which is precisely the vacuous-green shape #32
          # was hiding behind. Required mode turns that absence into a failure.
          OCTONOMY_SMOKE_REQUIRED: "1"
        # `make smoke` rather than an inline `go test`, so CI and a developer's
        # laptop run byte-identical logic -- including the guard that fails when
        # the test does not actually run. Two copies of this command would drift,
        # and the copy that drifts is the one nobody watches. The harness exports
        # its credentials through $GITHUB_ENV, so the target finds them in the
        # environment exactly as it finds them in .octonomy-harness.env locally.
        run: make smoke
      - name: Capture container logs
        if: failure()
        run: make dev-server-logs
      - name: Tear down the harness
        if: always()
        run: make dev-server-down
